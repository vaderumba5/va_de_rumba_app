name: va_de_rumba
description: Gestión de conciertos de Va de Rumba.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  uuid: ^4.5.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_storage: ^13.0.4
  cloud_firestore: ^6.7.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  file_picker: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/va_de_rumba_logo.png
    - assets/imports/conciertos_2026_import.json
